name: Build and Push Agent Images

# Per-image tags, driven by images.yaml. There is no repo-wide release tag: an
# image's tag is the upstream version it packages, so bumping one package builds
# and publishes one image without touching the others. This mirrors the
# repackage path in mcp-images.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - images.yaml
      - Dockerfile.*
      - lib/**
      - claude-code/**
      - codex/**
      - adk/**

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Build matrix from images.yaml
        id: set-matrix
        run: |
          # yq converts the manifest to JSON; jq computes the tag, which is
          # version, or version-packaging when packaging is set. The tag work is
          # in jq rather than yq because jq's conditional is the portable one.
          matrix=$(yq eval -o=json '.images' images.yaml | jq -c '{
            include: [ .[] | {
              name,
              version: (.version | tostring),
              tag: ((.version | tostring) + (if .packaging then "-" + (.packaging | tostring) else "" end))
            } ]
          }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  docker-build:
    needs: generate-matrix
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
      # Trivy uploads its results to code scanning, which this grants. It was
      # dropped when the scan moved into this job from a separate one.
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    # secrets cannot be read from a step-level `if`, so the presence of the
    # dispatch token is captured here, where env may reference secrets, and the
    # step below tests this instead.
    env:
      HAS_DISPATCH_PAT: ${{ secrets.DISPATCH_PAT != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # A tag is immutable once published, so a build only runs when its tag
      # does not already exist. Changing shared code without an upstream bump
      # therefore needs a packaging bump in images.yaml, or FORCE_REBUILD, since
      # otherwise the tag is unchanged and nothing rebuilds.
      - name: Check if the tag already exists
        id: check
        run: |
          if [ "${{ vars.FORCE_REBUILD }}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image="ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.tag }}"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$image already exists; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: true
          pull: true
          file: Dockerfile.${{ matrix.name }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            AGENT_VERSION=${{ matrix.version }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.tag }}

      - name: Install Cosign
        if: steps.check.outputs.exists == 'false'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v3.0.5"
      - name: Sign the image
        if: steps.check.outputs.exists == 'false'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAG: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.tag }}
        run: cosign sign --yes "${TAG}@${DIGEST}"

      - name: Run Trivy
        if: steps.check.outputs.exists == 'false'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ matrix.tag }}
          trivyignores: .trivyignore.yaml
          format: "sarif"
          output: "trivy-${{ matrix.name }}.sarif"
      - name: Upload SARIF
        if: steps.check.outputs.exists == 'false'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      # Ask the catalog to point this harness at the new tag. It opens a pull
      # request rather than pushing, since the catalog is what installations
      # sync. Skipped without DISPATCH_PAT: cross-repository dispatch cannot use
      # GITHUB_TOKEN, which is scoped to this repository.
      - name: Tell the catalog about the new tag
        if: ${{ steps.check.outputs.exists == 'false' && env.HAS_DISPATCH_PAT == 'true' }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          repository: ${{ github.repository_owner }}/hosted-agents-catalog
          event-type: update-image-tag
          client-payload: |
            {
              "image_name": "ghcr.io/${{ github.repository }}/${{ matrix.name }}",
              "new_tag": "${{ matrix.tag }}"
            }
