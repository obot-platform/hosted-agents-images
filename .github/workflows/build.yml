name: Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Dockerfiles
        run: |
          for dockerfile in Dockerfile.*; do
            docker buildx build --check --file "$dockerfile" .
          done

      # The entrypoints are the whole of an agent's start-up: they read Obot's
      # configuration and translate it for the tool. A syntax error in one is a
      # sandbox that crash-loops with no useful message, so they are checked
      # here rather than discovered in a cluster.
      - name: Lint shell
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            --exclude=SC1091 \
            lib/obot-agent.sh ./*/entrypoint.sh

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Build images
        # The version comes from images.yaml, the same source the publish
        # workflow uses, so this check builds exactly what a merge would publish
        # -- not whatever default the Dockerfile happened to carry.
        run: |
          yq -o=json '.images' images.yaml | jq -c '.[]' | while read -r image; do
            name=$(jq -r .name <<<"$image")
            version=$(jq -r .version <<<"$image")
            docker build --pull \
              --file "Dockerfile.$name" \
              --build-arg "AGENT_VERSION=$version" \
              --tag "$name:pr-check" .
          done

      # Each image has to boot from a configuration it has never seen before.
      # The check is that it reads one and reports what it found, not that it
      # reaches a model: there is no Obot here to reach.
      - name: Smoke test the configuration contract
        shell: bash
        run: |
          set -o pipefail
          config="$(mktemp -d)"
          cat >"$config/agent.json" <<'JSON'
          {
            "version": "v1",
            "instance": {"id": "smoke", "userID": "1", "name": "smoke"},
            "secretsFile": "/etc/obot/secrets.json",
            "workspace": "/workspace",
            "listenPort": 8000,
            "publicPath": "/agent-connect/smoke",
            "mcpServers": [
              {"id": "ms1smoke", "name": "ms1smoke", "url": "http://mcp.invalid/mcp-connect/ms1smoke",
               "transport": "streamable-http"}
            ],
            "models": [
              {"id": "m1smoke", "model": "smoke-model", "provider": "openai-model-provider",
               "apis": ["openai-responses", "openai-chat-completions"],
               "baseURL": "http://llm.invalid/v1", "default": true}
            ],
            "answers": {"instruction": "be brief"}
          }
          JSON
          cat >"$config/secrets.json" <<'JSON'
          {"version": "v1",
           "mcpServers": {"ms1smoke": {"headers": {"Authorization": "Bearer smoke"}}},
           "modelProviders": {"openai-model-provider": {"apiKey": "smoke"}}}
          JSON
          chmod -R a+rX "$config"

          # The shared library is the contract every image reads. Exercising it
          # directly proves the merge and the accessors, without needing a model.
          docker run --rm -v "$config:/etc/obot:ro" --entrypoint bash claude-code:pr-check -c '
            set -euo pipefail
            source /usr/local/lib/obot-agent.sh
            obot::require_config
            [ "$(obot::workspace)" = "/workspace" ]
            [ "$(obot::listen_port)" = "8000" ]
            [ "$(obot::public_path)" = "/agent-connect/smoke" ]
            [ "$(obot::answer instruction)" = "be brief" ]
            # A model is selected by protocol, and its credential is merged in
            # from the secrets file rather than read from the config. cut splits
            # the tab-separated result -- its default delimiter -- which avoids
            # a $'"'"'\t'"'"' literal that shellcheck cannot track through the
            # nested quoting here.
            m=$(obot::model openai-responses)
            [ "$(printf %s "$m" | cut -f1)" = "smoke-model" ]
            [ "$(printf %s "$m" | cut -f2)" = "http://llm.invalid/v1" ]
            [ "$(printf %s "$m" | cut -f3)" = "smoke" ]
            # A protocol the agent has no model for yields nothing, which is how
            # an image decides it cannot run.
            [ -z "$(obot::model anthropic)" ]
            echo "configuration contract OK"
          '

      # The contract test above stops at the accessor, which returns the
      # endpoint a client posts to. Each image still has to translate that into
      # whatever its CLI expects, and nothing observed that translation -- which
      # is how a base URL keeping the config's trailing /v1 shipped. Claude Code
      # appends "/v1/messages" itself, so it requested /v1/v1/messages and every
      # model call 404d, reported to the user as a model they cannot access.
      #
      # Running the entrypoint is the only way to see what it exported, so a
      # stub on PATH stands in for the CLI it execs.
      - name: Check Claude Code derives its API root from the model endpoint
        shell: bash
        run: |
          set -o pipefail
          config="$(mktemp -d)"
          cat >"$config/agent.json" <<'JSON'
          {
            "version": "v1",
            "instance": {"id": "smoke", "userID": "1", "name": "smoke"},
            "secretsFile": "/etc/obot/secrets.json",
            "workspace": "/workspace",
            "models": [
              {"id": "m1smoke", "model": "smoke-model", "provider": "anthropic-model-provider",
               "apis": ["anthropic"], "baseURL": "http://llm.invalid/v1", "default": true}
            ]
          }
          JSON
          cat >"$config/secrets.json" <<'JSON'
          {"version": "v1",
           "modelProviders": {"anthropic-model-provider": {"apiKey": "smoke"}}}
          JSON
          chmod -R a+rX "$config"

          # Written by the entrypoint as the agent user, so it cannot be read-only.
          workspace="$(mktemp -d)"
          chmod 777 "$workspace"

          stub="$(mktemp -d)"
          chmod 755 "$stub"
          printf '#!/bin/sh\nprintf "OBOT_TEST_BASE_URL=%%s\\n" "$ANTHROPIC_BASE_URL"\n' >"$stub/claude"
          chmod 755 "$stub/claude"

          out=$(docker run --rm \
            -v "$config:/etc/obot:ro" -v "$workspace:/workspace" -v "$stub:/stub:ro" \
            --entrypoint bash claude-code:pr-check \
            -c 'export PATH=/stub:$PATH; exec /usr/local/bin/obot-entrypoint')
          echo "$out"

          base=${out##*OBOT_TEST_BASE_URL=}
          base=${base%%$'\n'*}
          if [ "$base" != "http://llm.invalid" ]; then
            echo "ANTHROPIC_BASE_URL is $base; Claude Code appends /v1/messages to it" >&2
            exit 1
          fi
          echo "API root OK"

      # A pinned version is only pinned if the image really contains it. The
      # Claude Code package is a launcher whose installer fetches the program,
      # and an image that shipped only the launcher would download it at
      # start-up instead -- as a non-root user, into a root-owned directory, in
      # a pod that may have no egress. --network none is the check.
      - name: Check the agents run offline at the pinned version
        run: |
          claude_version=$(docker run --rm --network none --entrypoint claude claude-code:pr-check --version)
          echo "$claude_version"
          case "$claude_version" in
            2.1.220*) ;;
            *) echo "claude reports an unexpected version" >&2; exit 1 ;;
          esac
          docker run --rm --network none --entrypoint codex codex:pr-check --version
          docker run --rm --network none --entrypoint python adk:pr-check -c 'import google.adk; print(google.adk.__version__)'

      # bubblewrap is what Codex sandboxes model-directed commands in. Docker's
      # default seccomp profile blocks the namespace it needs, so this checks the
      # binary is installed; that it can create a sandbox is a property of the
      # cluster, where seccomp is unconfined.
      - name: Check Codex ships its sandbox
        run: docker run --rm --entrypoint bwrap codex:pr-check --version

      # Not `npm audit`: these images install their CLI globally, which leaves
      # no lockfile for it to read. Trivy inspects the built image instead,
      # which covers the OS packages and the Python dependencies too.
      #
      # Unfixed findings are ignored: a base-image CVE with no available patch
      # is not something a pull request can act on, and blocking on it would
      # teach everyone to ignore this step. The published images are scanned
      # again after release, where everything is reported rather than filtered.
      - name: Scan images for fixable vulnerabilities
        run: |
          for image in claude-code codex adk; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workspace" -w /workspace \
              aquasec/trivy:0.58.1 image \
                --ignorefile .trivyignore.yaml \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                --exit-code 1 \
                --scanners vuln \
                "$image:pr-check"
          done
